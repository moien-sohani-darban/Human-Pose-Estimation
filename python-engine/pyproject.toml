[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "human-pose-estimation-engine"
version = "0.1.0"
description = "Python engine foundation for the Human Pose Estimation desktop application"
requires-python = ">=3.13.5,<3.14"
dependencies = [
    "mediapipe==1.0.1",
    "numpy==2.5.2",
    "opencv-contrib-python==5.0.0.93",
]

[project.optional-dependencies]
test = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
testpaths = ["tests"]
markers = [
    "integration: requires a local MediaPipe Pose Landmarker model asset",
]
